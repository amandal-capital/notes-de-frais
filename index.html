<title>Notes de frais</title>
<style>
:root{--brand:#8B0000;--bg:#F6F4F2;--surface:#fff;--line:#E4DEDA;--ink:#1A1A1A;--ink-2:#555}
@media (prefers-color-scheme: dark){:root{--brand:#E06A6A;--bg:#161414;--surface:#201D1D;--line:#3A3434;--ink:#F1ECEA;--ink-2:#C2BAB7}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px}
.logo{display:flex;justify-content:center;margin-bottom:16px}.logo img{height:90px}
h1{font-size:19px;text-align:center;margin:0 0 4px}p{color:var(--ink-2);text-align:center;margin:0 0 18px;font-size:14px}
label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:4px;font-weight:500}
input[type=password]{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input[type=password]:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.ck{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-2);margin:12px 0 16px}
button{width:100%;padding:10px;border:0;border-radius:8px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button[disabled]{opacity:.6}
.err{color:var(--brand);font-size:13.5px;min-height:20px;margin-top:10px;text-align:center}
</style>

const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d(P.s),iterations:P.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:d(P.i)},key,d(P.c)));
  document.open(); document.write(html); document.close();
}
const get=(st)=>{try{return st.getItem("ndf_acces")}catch(e){return null}};
const put=(st,v)=>{try{v===null?st.removeItem("ndf_acces"):st.setItem("ndf_acces",v)}catch(e){}};

document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault(); const b=document.getElementById("b"), e=document.getElementById("e"), pw=document.getElementById("k").value;

  b.disabled=true; b.textContent="Ouverture…"; e.textContent="";
  try{ put(sessionStorage,pw); if(document.getElementById("r").checked) put(localStorage,pw); await open_(pw); }
  catch(x){ put(sessionStorage,null); e.textContent="Mot de passe d'accès incorrect."; b.disabled=false; b.textContent="Entrer"; }
});
